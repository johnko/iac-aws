cache:
  # No effect for lambda: Cannot specify cache for lambda compute
  paths:
    # List of directories to cache, absolute or relative to the source directory
    - /tmp/.terraform.d-plugin-cache/**/*
# See https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
env:
  exported-variables:
    - CDK_DEPLOY_EXIT_CODE # pass this variable up to CodePipeline if needed
  # secrets-manager:
  #   key: secret-id:json-key:version-stage:version-id

  parameter-store:
    TF_VAR_PLAN_SLACK_WEBHOOK_URL: TF_VAR_PLAN_SLACK_WEBHOOK_URL
  shell: bash
  variables:
    # See https://docs.aws.amazon.com/codebuild/latest/userguide/build-env-ref-env-vars.html
    CI: "true"
    CDK_TMP_LOG: /tmp/.cdk-deploy.log
phases:
  build:
    commands:
      - |
        set -uo pipefail
        set +e
        bash .github/cdk.sh $WORKSPACE_PATH auto 2>&1 |
          tee "$CDK_TMP_LOG"
        export CDK_DEPLOY_EXIT_CODE=$?
  install:
    runtime-versions:
      # See https://docs.aws.amazon.com/codebuild/latest/userguide/available-runtimes.html
      nodejs: 24
    commands:
      - |
        bash ./aws/org1/buildspec_install_cdk.sh
        export PATH=$PATH:~/bin
        cdk --version
  post_build:
    commands:
      # exit because we need to mark pipeline as failed when CDK_DEPLOY_EXIT_CODE != 0
      - |
        if [[ $CDK_DEPLOY_EXIT_CODE != 0 ]]; then
          exit $CDK_DEPLOY_EXIT_CODE
        fi
    finally:
      - |
        bash ./aws/org1/buildspec_post_build.sh
      # If the Approval step was rejected, then handle with aws/org1/deployment_builds/pipelinecommon/codepipeline_handle_rejected_approval_event.tf
  pre_build:
    commands:
      - bash ./aws/org1/buildspec_pre_build.sh
version: 0.2
