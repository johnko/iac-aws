artifacts:
  files:
    - '**/*'
cache:
  # No effect for lambda: Cannot specify cache for lambda compute
  paths:
    # List of directories to cache, absolute or relative to the source directory
    - /tmp/.terraform.d-plugin-cache/**/*
# See https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
env:
  exported-variables:
    - CDK_DIFF_EXIT_CODE # pass this variable up to CodePipeline so we can skip the Deploy stage
  # secrets-manager:
  #   key: secret-id:json-key:version-stage:version-id

  parameter-store:
    TF_VAR_PLAN_SLACK_WEBHOOK_URL: TF_VAR_PLAN_SLACK_WEBHOOK_URL
  shell: bash
  variables:
    CDK_TMP_LOG: /tmp/.cdk-diff.log
    # See https://docs.aws.amazon.com/codebuild/latest/userguide/build-env-ref-env-vars.html
    CI: "true"
phases:
  build:
    commands:
      - |
        set -uo pipefail
        set +e
        bash .github/cdk.sh $WORKSPACE_PATH diff 2>&1 |
          tee "$CDK_TMP_LOG"
        export CDK_DIFF_EXIT_CODE=$?
  install:
    runtime-versions:
      # See https://docs.aws.amazon.com/codebuild/latest/userguide/available-runtimes.html
      # NOTE: this is ignored in CodeBuild compute_type == "BUILD_LAMBDA_1GB"
      nodejs: 24
  post_build:
    commands:
      # 0 = Succeeded with empty diff (no changes), need to stop pipeline from going to CDKDeploy
      # 1 = Succeeded with non-empty diff (changes present), need to continues pipeline to ApproveOrReject and CDKDeploy
      # don't exit on 1 because it will stop pipeline, so exit on 0
      - |
        if [[ $CDK_DIFF_EXIT_CODE != 1 ]]; then
          exit $CDK_DIFF_EXIT_CODE
        fi
    finally:
      - |
        bash ./aws/org1/buildspec_post_build.sh
  pre_build:
    commands:
      - bash ./aws/org1/buildspec_pre_build.sh
      - |
        bash ./aws/org1/buildspec_install_cdk.sh
        export PATH=$PATH:~/bin
        cdk --version
version: 0.2
